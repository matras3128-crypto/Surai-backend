<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">

<meta name="google-adsense-account" content="ca-pub-5506251863984103">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Surai — казахстанский поисковик by Synthetix Lab">
<meta name="theme-color" content="#f2f9f9">
<title>Surai</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232fb7ad'/%3E%3Cstop offset='1' stop-color='%234aa8e0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='12' fill='url(%23g)'/%3E%3Ccircle cx='19' cy='19' r='8' fill='none' stroke='white' stroke-width='3.2'/%3E%3Cpath d='M25 25l6 6' stroke='white' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
(function(){try{
  var t=JSON.parse(localStorage.getItem('surai.theme'));
  if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
  document.documentElement.setAttribute('data-theme',t);
}catch(e){}})();
</script>
<style>
:root{
  --bg:#f2f9f9; --surface:#ffffff; --surface-2:#e8f4f4; --border:#d3e7e7;
  --text:#17302f; --muted:#5d7d7c;
  --accent:#1c928c; --accent-hover:#167d78; --accent-soft:#dbf0ee; --accent-ink:#126f6a; --on-accent:#ffffff;
  --link:#1b6c92; --glow:rgba(42,166,160,.13); --glow2:rgba(74,168,224,.10);
  --g1:#1c928c; --g2:#3b93cf;
  --shadow:0 2px 14px rgba(23,48,47,.07); --shadow-lg:0 18px 50px rgba(23,48,47,.18);
  --danger:#c0473f;
}
:root[data-theme="dark"]{
  --bg:#0e1819; --surface:#142224; --surface-2:#1a2d2f; --border:#25393b;
  --text:#d9ecea; --muted:#8aa9a7;
  --accent:#3fbdb4; --accent-hover:#58d0c7; --accent-soft:#17383a; --accent-ink:#76dcd4; --on-accent:#06201e;
  --link:#86d8e6; --glow:rgba(63,189,180,.11); --glow2:rgba(80,160,220,.08);
  --g1:#52cdc4; --g2:#6cb6ee;
  --shadow:0 2px 14px rgba(0,0,0,.35); --shadow-lg:0 18px 50px rgba(0,0,0,.55);
  --danger:#ef7c74;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;transition:background .25s,color .25s;
  -webkit-font-smoothing:antialiased;
}
body.home{
  background:
    radial-gradient(900px 420px at 50% -8%,var(--glow),transparent 70%),
    radial-gradient(700px 360px at 85% 8%,var(--glow2),transparent 70%),
    var(--bg);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{display:inline-flex;width:20px;height:20px;flex:none}
.ico svg{width:100%;height:100%}

/* ---------- Топбар ---------- */
.topbar{position:sticky;top:0;z-index:30;transition:background .25s}
.bar{display:flex;align-items:center;gap:24px;padding:12px 24px}
body.results .topbar{background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
body.home .topbar{position:absolute;left:0;right:0;top:0}
body.home .topbar .brand,body.home #hdrBox,body.home .tabs{display:none}
.controls{display:flex;align-items:center;gap:8px;margin-left:auto}

.brand{display:inline-flex;align-items:flex-end;gap:9px;text-decoration:none;color:inherit;min-width:172px}
.brand .logo{width:34px;height:34px;flex:none;align-self:center}
.brand .word{font-size:27px;font-weight:800;letter-spacing:-.8px;line-height:1;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .by{font-size:11px;color:var(--muted);margin-bottom:2px;white-space:nowrap;letter-spacing:.2px}
.brand.big{gap:14px;min-width:0}
.brand.big .logo{width:66px;height:66px}
.brand.big .word{font-size:72px;letter-spacing:-3px}
.brand.big .by{font-size:14px;margin-bottom:8px}

.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:.15s;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.controls .icon-btn{border-color:var(--border);background:var(--surface)}
.controls .icon-btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:9px;font-weight:600;font-size:13px;transition:.15s}
.seg button.on{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.seg.full{display:flex;width:100%}.seg.full button{flex:1;padding:8px}
.i-sun{display:none}
:root[data-theme="dark"] .i-sun{display:inline-flex}
:root[data-theme="dark"] .i-moon{display:none}
.btn-login{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600;font-size:14px;transition:.15s}
.btn-login:hover{background:var(--accent);color:var(--on-accent)}
.btn-primary{height:44px;padding:0 20px;border-radius:11px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;transition:.15s}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary.wide{width:100%}
.btn-ghost{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:14px;transition:.15s}
.btn-ghost:hover{border-color:var(--danger);color:var(--danger)}
.avatar{width:38px;height:38px;border-radius:50%;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:700;overflow:hidden;padding:0;display:inline-flex;align-items:center;justify-content:center}
.avatar img{width:100%;height:100%;object-fit:cover}
.usermenu-wrap{position:relative}
.usermenu{position:absolute;right:0;top:46px;min-width:230px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;z-index:60}
.usermenu .who{padding:10px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.usermenu .who b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usermenu .who span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.usermenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 12px;border-radius:9px;font-size:14px;text-align:left}
.usermenu button:hover{background:var(--surface-2)}

/* ---------- Строка поиска ---------- */
.search-box{position:relative;flex:1;max-width:720px;width:100%}
.search-form{display:flex;align-items:center;gap:2px;background:var(--surface);border:2px solid var(--border);border-radius:15px;padding-left:14px;transition:border-color .15s,box-shadow .15s;box-shadow:var(--shadow)}
.search-form:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search-form .lead{color:var(--muted)}
.search-form input{flex:1;min-width:0;height:46px;border:0;outline:0;background:transparent;padding:0 8px 0 10px;font-size:17px}
.search-form input::placeholder{color:var(--muted);opacity:.8}
.search-form .go{height:calc(100% - 8px);align-self:stretch;margin:4px;padding:0 22px;border:0;border-radius:11px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;transition:.15s}
.search-form .go:hover{background:var(--accent-hover)}
.search-form .lucky{height:calc(100% - 8px);align-self:stretch;margin:4px 4px 4px 0;padding:0 14px;border:0;border-radius:11px;background:transparent;color:var(--accent-ink);font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}
.search-form .lucky:hover{background:var(--accent-soft)}
.search-form .mic.on{color:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;z-index:50;overflow:hidden}
.sug-title{padding:6px 12px 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.sug-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:15px}
.sug-item .ico{color:var(--muted);width:18px;height:18px}
.sug-item.active,.sug-item:hover{background:var(--surface-2)}
.sug-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug-trend{color:var(--accent);font-size:11px;font-weight:700;margin-left:4px}
.sug-del{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;width:26px;height:26px;border-radius:7px}
.sug-del:hover{background:var(--border);color:var(--text)}

.tabs{display:flex;gap:4px;padding:0 24px}
.tab{border:0;background:transparent;padding:9px 14px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}

/* ---------- Главная ---------- */
main{flex:1;display:flex;flex-direction:column}
.home-view{flex:1;display:flex;flex-direction:column;align-items:center;padding:90px 20px 40px;gap:26px}
.home-top{display:flex;flex-direction:column;align-items:center;gap:26px}
.tagline{margin:-8px 0 0;color:var(--muted);font-size:16px}
.home-view .search-box{max-width:690px}
.home-view .search-form input{height:56px;font-size:18px}

/* Быстрые ссылки */
.shortcuts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:720px;margin-top:8px}
.shortcut{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border-radius:12px;text-decoration:none;color:var(--text);width:80px;transition:.15s;border:1px solid transparent}
.shortcut:hover{background:var(--surface);border-color:var(--border);transform:translateY(-2px)}
.shortcut .icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--surface-2)}
.shortcut .name{font-size:12px;color:var(--muted);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}

/* Тренды */
.trending-section{width:100%;max-width:720px;margin-top:20px}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title .ico{color:var(--accent);width:16px;height:16px}
.trends{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.trend-chip{padding:8px 14px;border:1px solid var(--border);background:var(--surface);border-radius:999px;font-size:13px;transition:.15s;cursor:pointer;color:var(--text);text-decoration:none}
.trend-chip:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.trend-chip .rank{color:var(--accent);font-weight:700;margin-right:4px}

/* ---------- Лента новостей ---------- */
.news-feed{width:100%;max-width:1100px;margin:30px auto 0;padding:0 20px}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.news-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.2s;cursor:pointer;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.news-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.news-card.featured{grid-column:span 2}
.news-card .img{width:100%;height:180px;background:var(--surface-2);overflow:hidden;position:relative}
.news-card.featured .img{height:240px}
.news-card .img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.news-card:hover .img img{transform:scale(1.05)}
.news-card .img .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:48px}
.news-card .body{padding:14px 16px;flex:1;display:flex;flex-direction:column}
.news-card .source{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:6px}
.news-card .source img{width:16px;height:16px;border-radius:3px}
.news-card .source b{color:var(--text);font-weight:600}
.news-card h3{margin:0 0 6px;font-size:16px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-card.featured h3{font-size:20px}
.news-card p{margin:0;font-size:14px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.news-card .meta{margin-top:8px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.news-card .badge{padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);font-size:11px;font-weight:600;text-transform:uppercase}
.news-skeleton{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;height:320px}
.news-skeleton .img{height:180px;background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2));background-size:200% 100%;animation:sh 1.3s infinite linear}
.news-skeleton .body{padding:14px 16px}
.news-skeleton .sk{height:12px;margin-bottom:10px;background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2));background-size:200% 100%;animation:sh 1.3s infinite linear;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- Выдача ---------- */
.results{width:100%;padding:18px 24px 60px}
.col{max-width:760px}
.meta{font-size:13px;color:var(--muted);margin:0 0 12px}
.ai{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:14px;padding:15px 18px;margin-bottom:10px;box-shadow:var(--shadow)}
.ai-head{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--accent-ink);font-size:14px;margin-bottom:8px}
.ai-head .ico{width:18px;height:18px}
.ai p{margin:0;font-size:15.5px;line-height:1.6;white-space:pre-wrap}
.ai small{display:block;margin-top:10px;color:var(--muted);font-size:12px}
.res{padding:14px 0}
.res-site{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.res-site img{width:18px;height:18px;border-radius:5px;background:var(--surface-2);flex:none}
.res-site .dom{color:var(--text);opacity:.85;font-weight:500}
.res-site .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-title{display:inline-block;font-size:19px;line-height:1.3;color:var(--link);text-decoration:none;font-weight:500;margin:4px 0 5px;word-break:break-word}
.res-title:hover{text-decoration:underline}
.res-date{font-size:13px;color:var(--muted);margin-right:6px}
.res-snippet{margin:0;font-size:15px;line-height:1.55;opacity:.9;word-break:break-word}
.res-snippet b{font-weight:600;opacity:1}
.grid{columns:4 190px;column-gap:12px}
.grid figure{break-inside:avoid;margin:0 0 12px;border-radius:12px;overflow:hidden;background:var(--surface-2);cursor:zoom-in;border:1px solid var(--border);transition:.15s;position:relative}
.grid figure::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.4));opacity:0;transition:.15s;pointer-events:none}
.grid figure:hover::after{opacity:1}
.grid figure:hover{border-color:var(--accent);transform:translateY(-2px)}
.grid img{display:block;width:100%;height:auto;opacity:0;transition:opacity .3s}
.grid img.loaded{opacity:1}
.grid figcaption{position:absolute;bottom:0;left:0;right:0;padding:8px 10px;color:#fff;font-size:12px;line-height:1.3;opacity:0;transition:.15s;z-index:1}
.grid figure:hover figcaption{opacity:1}
.state{max-width:480px;padding:40px 0;color:var(--muted)}
.state h3{margin:12px 0 6px;color:var(--text);font-size:19px}
.state p{margin:0;line-height:1.55}
.state .ico{width:34px;height:34px;color:var(--accent)}
.state.err .ico{color:var(--danger)}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2));background-size:200% 100%;animation:sh 1.3s infinite linear}
.sk-res{padding:16px 0}.sk-res .sk{height:12px;margin-bottom:10px}

footer{padding:18px 24px;text-align:center;font-size:13px;color:var(--muted)}
footer .by{opacity:.85}
body.results footer{text-align:left}

/* ---------- Модальные окна ---------- */
.overlay{position:fixed;inset:0;background:rgba(7,22,22,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;width:100%;max-width:430px;max-height:92vh;overflow:auto;padding:22px;box-shadow:var(--shadow-lg);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-head h2{margin:0;font-size:20px}
.group{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:16px 0 4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border)}
.row:last-of-type{border-bottom:0}
.row .lbl{min-width:0}.row .lbl b{font-weight:600;font-size:15px;display:block}.row .lbl small{color:var(--muted);font-size:12.5px}
select{border:1px solid var(--border);background:var(--surface-2);border-radius:9px;padding:7px 10px;font-size:14px;max-width:170px}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1;width:100%;height:100%}
.switch span{position:absolute;inset:0;background:var(--border);border-radius:99px;transition:.2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:46px;border-radius:11px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:15px;transition:.15s}
.btn-google:hover{border-color:var(--accent);background:var(--surface-2)}
.btn-google svg{width:20px;height:20px}
.or{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.field{display:block;margin-top:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input{width:100%;height:44px;border:1px solid var(--border);background:var(--surface-2);border-radius:11px;padding:0 13px;font-size:15px;outline:0;transition:.15s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.msg{min-height:20px;margin:10px 0 8px;font-size:13.5px;color:var(--danger)}
.hint{margin:14px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.lightbox{max-width:900px;padding:14px;text-align:center}
.lightbox img{max-width:100%;max-height:72vh;border-radius:12px;display:block;margin:0 auto}
.lightbox p{margin:10px 0;color:var(--muted);font-size:14px}
.lightbox a{color:var(--accent-ink);font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:11px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%)}

@media(min-width:1000px){
  .results .col{margin-left:196px}
  .tabs{padding-left:220px}
}
@media(max-width:760px){
  .bar{flex-wrap:wrap;gap:10px 12px;padding:10px 14px}
  #hdrBox{order:3;flex-basis:100%;max-width:none}

function routeFromHash() {

  let items = [], active = -1, trends = [];
  const hide = () => { sug.hidden = true; active = -1; };
  const mark = () => $$('.sug-item', sug).forEach((n, i) => n.classList.toggle('active', i === active));

  function show() {
    const v = input.value.trim().toLowerCase();
    const hist = state.settings.saveHistory ? store.get('history', []) : [];
    const histItems = hist.filter(h => (!v || h.toLowerCase().includes(v)) && h.toLowerCase() !== v).slice(0, 4);
    const trendItems = v ? trends.filter(tr => tr.toLowerCase().includes(v)).slice(0, 3) : [];
    items = [...histItems.map(h => ({ text: h, type: 'history' })), ...trendItems.map(tr => ({ text: tr, type: 'trend' }))];

    items.forEach(item => {
      const row = el('div', { class: 'sug-item', role: 'option' },

}

/* ---------- API запросы ---------- */
async function apiSearch(q, tab, signal) {
  const s = state.settings;
  
  // Пробуем через бэкенд
  if (CONFIG.USE_BACKEND && state.backendAvailable !== false) {
    try {
      const res = await fetch(CONFIG.API_BASE + '/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: q, tab, settings: { ...s, lang: state.lang } }),
        signal
      });
      if (res.ok) {
        state.backendAvailable = true;
        return res.json();
      }
      if (res.status === 503) state.backendAvailable = false;
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      state.backendAvailable = false;
    }
  }
  
  // Fallback прямой запрос
  const body = {
    query: q,
    search_depth: tab === 'images' ? 'basic' : s.depth,
    max_results: tab === 'images' ? CONFIG.IMAGES_PER_PAGE : s.count,
    topic: tab === 'news' ? 'news' : 'general',
    include_answer: tab === 'all' && !!s.ai,
    include_images: tab === 'images',
    include_image_descriptions: tab === 'images'
  };
  if (tab === 'all' && s.ai) {
    body.include_answer_prompt = state.lang === 'kk'
      ? 'Жауапты тек қазақ тілінде бер. Қысқа әрі нақты жауап бер. Markdown пайдаланба.'
      : 'Отвечай только на русском языке. Давай краткий и точный ответ. Не используй Markdown.';
  }
  if (s.time) body.time_range = s.time;
  if (tab !== 'news' && s.kz) body.country = 'kazakhstan';

  const headers = { 'Content-Type': 'application/json' };
  if (CONFIG.TAVILY_DIRECT_KEY) headers.Authorization = 'Bearer ' + CONFIG.TAVILY_DIRECT_KEY;
  const res = await fetch(CONFIG.TAVILY_ENDPOINT, { method: 'POST', signal, headers, body: JSON.stringify(body) });
  if (!res.ok) {
    const code = (res.status === 401 || res.status === 403) ? 'auth' : (res.status === 429) ? 'limit' : 'http';
    throw Object.assign(new Error('HTTP ' + res.status), { code, status: res.status });
  }
  return res.json();
}

let seq = 0, controller = null;
const cache = new Map();

async function runSearch(q, tab) {
  state.q = q; state.tab = tab;
  setMode('results'); syncInputs(); updateTitle();
  $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  addHistory(q);
  if (tab === 'images') { state.imagesOffset = 0; state.imagesTotal = []; }
  const my = ++seq;
  if (controller) controller.abort();
  controller = new AbortController();
  showLoading();
  const key = JSON.stringify([q, tab, state.settings, state.lang]);
  try {
    let out = cache.get(key);
    if (!out) {
      const t0 = performance.now();
      const data = await apiSearch(q, tab, controller.signal);
      out = { data, ms: performance.now() - t0 };
      cache.set(key, out);
    }
    if (my !== seq) return;
    state.lastRender = () => renderResults(out.data, q, tab, out.ms);
    state.lastRender();
  } catch (e) {
    if (e.name === 'AbortError' || my !== seq) return;
    console.error('[Surai]', e);
    state.lastRender = () => renderError(e);
    state.lastRender();
  }
  window.scrollTo({ top: 0 });
}

              title: i.title,

    }
    
    grid.replaceChildren();

    grid.replaceChildren(el('p', { style: 'color:var(--muted);text-align:center;padding:20px', text: t('newsError') }));
  }
}

function formatTimeAgo(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    const diff = Date.now() - d.getTime();
    const min = Math.floor(diff / 60000);
    const hr = Math.floor(diff / 3600000);
    const day = Math.floor(diff / 86400000);
    if (min < 1) return t('justNow');
    if (min < 60) return t('minutesAgo', { n: min });
    if (hr < 24) return t('hoursAgo', { n: hr });
    if (day < 7) return t('daysAgo', { n: day });
    return d.toLocaleDateString(state.lang === 'kk' ? 'kk-KZ' : 'ru-RU', { day: 'numeric', month: 'short' });
  } catch { return ''; }
}

function highlight(text, q) {
  const words = q.split(/\s+/).filter(w => w.length > 2).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const frag = document.createDocumentFragment();
  if (!words.length) { frag.append(text); return frag; }
  let re; try { re = new RegExp('(' + words.join('|') + ')', 'giu'); } catch { frag.append(text); return frag; }
  text.split(re).forEach((part, i) => { if (!part) return; frag.append(i % 2 ? el('b', { text: part }) : part); });
  return frag;
}
function clip(s, n) {
  s = (s || '').replace(/\s+/g, ' ').trim();
  if (s.length <= n) return s;
  const cut = s.slice(0, n), sp = cut.lastIndexOf(' ');
  return (sp > n * 0.6 ? cut.slice(0, sp) : cut) + '…';
}
function fmtDate(d) {
  try {
    const x = new Date(d); if (isNaN(x)) return '';
    return x.toLocaleDateString(state.lang === 'kk' ? 'kk-KZ' : 'ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch { return ''; }
}
function resultItem(r, q, tab) {
  const href = safeUrl(r.url); const u = new URL(href);
  const host = u.hostname.replace(/^www\./, '');
  let crumbs = '';
  try { crumbs = u.pathname.split('/').filter(Boolean).slice(0, 2).map(decodeURIComponent).join(' › '); } catch {}
  const fav = el('img', { src: 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(u.hostname) + '&sz=64', alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' });
  fav.addEventListener('error', () => { fav.style.visibility = 'hidden'; });
  const snippet = el('p', { class: 'res-snippet' });
  if (tab === 'news' && r.published_date) { const d = fmtDate(r.published_date); if (d) snippet.append(el('span', { class: 'res-date', text: d + ' —' })); }
  snippet.append(highlight(clip(r.content, 300), q));
  return el('article', { class: 'res' },
    el('div', { class: 'res-site' }, fav, el('span', { class: 'dom', text: host }), crumbs ? el('span', { class: 'path', text: '› ' + crumbs }) : null),
    el('a', { class: 'res-title', href, target: '_blank', rel: 'noopener noreferrer', text: r.title || host }),
    snippet);
}
function aiCard(answer) {
  return el('div', { class: 'ai' },
    el('div', { class: 'ai-head' }, iconEl('spark'), el('span', { text: t('aiTitle') })),
    el('p', { text: answer }), el('small', { text: t('aiNote') }));
}
function stateBox(icon, title, text, err) {
  return el('div', { class: 'state' + (err ? ' err' : '') }, iconEl(icon), el('h3', { text: title }), el('p', { text }));
}

function createImageFigure(imgData, idx) {
  const url = safeUrl(imgData.url);
  if (!url) return null;
  const isEager = idx < 8;
  const img = el('img', { 
    src: url, alt: imgData.description || state.q, 
    loading: isEager ? 'eager' : 'lazy', decoding: 'async',
    fetchpriority: idx < 4 ? 'high' : 'auto', referrerpolicy: 'no-referrer'
  });
  img.addEventListener('load', () => img.classList.add('loaded'));
  img.addEventListener('error', () => { if (fig.parentNode) fig.remove(); });
  const fig = el('figure', { tabindex: '0', role: 'button' }, img);
  if (imgData.description) fig.append(el('figcaption', { text: imgData.description }));
  fig.addEventListener('click', () => openLightbox(imgData));
  fig.addEventListener('keydown', e => { if (e.key === 'Enter') openLightbox(imgData); });
  return fig;
}

function renderResults(data, q, tab, ms) {
  const box = $('#results'); box.replaceChildren();
  if (tab === 'images') {
    const imgs = (data.images || []).map(i => typeof i === 'string' ? { url: i, description: '' } : i).filter(i => i && safeUrl(i.url));
    if (!imgs.length) return void box.append(stateBox('empty', t('noResTitle'), t('noResText')));
    state.imagesTotal = imgs;
    state.imagesOffset = imgs.length;
    const grid = el('div', { class: 'grid', id: 'imagesGrid' });
    imgs.forEach((img, idx) => { const fig = createImageFigure(img, idx); if (fig) grid.append(fig); });
    box.append(grid);
    preloadImages(imgs.slice(8, 16).map(i => safeUrl(i.url)).filter(Boolean));
    return;
  }
  const list = (data.results || []).filter(r => r && safeUrl(r.url));
  if (!list.length && !data.answer) return void box.append(stateBox('empty', t('noResTitle'), t('noResText')));
  box.append(el('p', { class: 'meta', text: t('resCount', { n: list.length }) + ' · ' + (ms / 1000).toFixed(2) + ' ' + t('sec') }));
  if (data.answer) box.append(aiCard(data.answer));
  list.forEach(r => box.append(resultItem(r, q, tab)));
}
function renderError(e) {
  const k = e.code === 'auth' ? 'errAuth' : e.code === 'limit' ? 'errLimit' : e.code === 'network' ? 'errNetwork' : 'errGeneric';
  const box = $('#results'); box.replaceChildren(stateBox('alert', t('errTitle'), t(k), true));
}

/* ---------- модальные окна ---------- */
let settingsDirty = false;
function openModal(id) {
  closeMenus();
  $$('.overlay.open').forEach(m => m.classList.remove('open'));
  const m = $('#' + id); m.classList.add('open');
  const f = $('input:not([type=checkbox]),select,.btn-google,[data-close]', m); if (f && id === 'authModal') setTimeout(() => $('#aEmail').focus(), 30);
}
function closeModal() {
  $$('.overlay.open').forEach(m => m.classList.remove('open'));
  if (settingsDirty) { settingsDirty = false; if (!isHome()) applyRoute(); }
}
function closeMenus() { $('#userMenu').hidden = true; }
function openLightbox(i) {
  const u = safeUrl(i.url); if (!u) return;
  $('#lbImg').src = u; $('#lbImg').alt = i.description || '';
  $('#lbCap').textContent = i.description || ''; $('#lbCap').hidden = !i.description;
  $('#lbOpen').href = u; openModal('lightbox');
}

function initSettings() {
  const s = state.settings;
  $('#setCount').value = String(s.count); $('#setDepth').value = s.depth; $('#setTime').value = s.time;
  $('#setKz').checked = !!s.kz; $('#setAi').checked = !!s.ai; $('#setHist').checked = !!s.saveHistory;
  const bind = (id, key, conv, affectsSearch) => $('#' + id).addEventListener('change', e => {
    s[key] = conv(e.target); store.set('settings', s); if (affectsSearch) settingsDirty = true;
  });
  bind('setCount', 'count', n => +n.value, true);
  bind('setDepth', 'depth', n => n.value, true);
  bind('setTime', 'time', n => n.value, true);
  bind('setKz', 'kz', n => n.checked, true);
  bind('setAi', 'ai', n => n.checked, true);
  bind('setHist', 'saveHistory', n => n.checked, false);
  $('#clearHist').addEventListener('click', () => { store.del('history'); toast(t('histCleared')); });
}

let authMode = 'login';
function renderUser() {
  const u = state.user;
  $('#loginBtn').hidden = !!u; $('#userWrap').hidden = !u;
  if (!u) return;
  const btn = $('#userBtn'); btn.replaceChildren();
  const pic = u.picture && safeUrl(u.picture);
  if (pic) btn.append(el('img', { src: pic, alt: '', referrerpolicy: 'no-referrer' }));
  else btn.textContent = (u.name || u.email || '?').trim().charAt(0).toUpperCase();
  $('#umName').textContent = u.name || ''; $('#umEmail').textContent = u.email || '';
}
function setSession(u) {
  state.user = u; if (u) store.set('session', u); else store.del('session');
  renderUser();
}
function authMsg(key) {
  const m = $('#authMsg');
  if (key) { m.dataset.i18n = key; m.textContent = t(key); } else { delete m.dataset.i18n; m.textContent = ''; }
}
function setAuthMode(m) {
  authMode = m;
  $$('#authTabs button').forEach(b => b.classList.toggle('on', b.dataset.auth === m));
  $('#nameField').hidden = m !== 'register';
  $('#aPass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('#authSubmit').textContent = t(m === 'login' ? 'submitLogin' : 'submitRegister');
  authMsg('');
}
async function hashPw(pw, salt) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pw));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch { return 'x' + btoa(unescape(encodeURIComponent(salt + ':' + pw))); }
}
function randSalt() {
  try { return [...crypto.getRandomValues(new Uint8Array(12))].map(b => b.toString(16).padStart(2, '0')).join(''); }
  catch { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
}
async function submitAuth(e) {
  e.preventDefault();
  const email = $('#aEmail').value.trim().toLowerCase(), pass = $('#aPass').value, name = $('#aName').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) return authMsg('badEmail');
  if (pass.length < 6) return authMsg('shortPass');
  const users = store.get('users', {});
  if (authMode === 'register') {
    if (users[email]) return authMsg('emailTaken');
    const salt = randSalt();
    users[email] = { name: name || email.split('@')[0], salt, hash: await hashPw(pass, salt) };
    store.set('users', users);
  } else {
    const u = users[email];
    if (!u || u.hash !== await hashPw(pass, u.salt)) return authMsg('badCreds');
  }
  const acc = users[email];
  setSession({ name: acc.name, email, provider: 'email' });
  $('#authForm').reset(); authMsg(''); closeModal();
  toast(t('welcome', { name: acc.name }));
}

// ============ НАСТОЯЩИЙ GOOGLE AUTH через Firebase ============
async function googleLogin() {
  if (!firebaseAuth) return authMsg('googleFail');
  
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  
  try {
    const result = await firebaseAuth.signInWithPopup(provider);
    const idToken = await result.user.getIdToken();
    
    // Отправляем токен на бэкенд для верификации
    if (CONFIG.USE_BACKEND && state.backendAvailable !== false) {
      try {
        const res = await fetch(CONFIG.API_BASE + '/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken })
        });
        if (res.ok) {
          const user = await res.json();
          setSession(user);
          authMsg(''); closeModal();
          toast(t('welcome', { name: user.name }));
          return;
        }
      } catch {}
    }
    
    // Если бэкенд недоступен, берём данные из Firebase напрямую
    const user = result.user;
    setSession({
      name: user.displayName,
      email: user.email,
      picture: user.photoURL,
      provider: 'google'
    });
    authMsg(''); closeModal();
    toast(t('welcome', { name: user.displayName || user.email }));
  } catch (e) {
    console.error('[Google Auth]', e);
    if (e.code === 'auth/popup-closed-by-user') return;
    if (e.code === 'auth/cancelled-popup-request') return;
    authMsg('googleFail');
  }
}

// Слушаем изменения авторизации Firebase
if (firebaseAuth) {
  firebaseAuth.onAuthStateChanged(async user => {
    if (user && !state.user) {
      // Восстанавливаем сессию при загрузке
      try {
        const idToken = await user.getIdToken();
        if (CONFIG.USE_BACKEND && state.backendAvailable !== false) {
          try {
            const res = await fetch(CONFIG.API_BASE + '/api/auth/google', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ idToken })
            });
            if (res.ok) {
              const userData = await res.json();
              setSession(userData);
              return;
            }
          } catch {}
        }
        setSession({
          name: user.displayName,
          email: user.email,
          picture: user.photoURL,
          provider: 'google'
        });
      } catch {}
    }
  });
}

async function loadMoreImages() {
  if (state.imagesLoading || state.tab !== 'images') return;
  state.imagesLoading = true;
  const grid = $('#imagesGrid');
  if (!grid) { state.imagesLoading = false; return; }
  const skeletons = [];
  for (let i = 0; i < 8; i++) {
    const sk = el('div', { class: 'sk', style: 'height:' + (130 + Math.random() * 90) + 'px;margin-bottom:12px' });
    skeletons.push(sk);
    grid.append(sk);
  }
  try {
    const my = ++seq;
    const data = await apiSearch(state.q, 'images', controller.signal);
    if (my !== seq) return;
    const imgs = (data.images || []).map(i => typeof i === 'string' ? { url: i, description: '' } : i).filter(i => i && safeUrl(i.url));
    skeletons.forEach(sk => { if (sk.parentNode) sk.remove(); });
    const existingUrls = new Set([...grid.querySelectorAll('img')].map(img => img.src));
    let added = 0;
    imgs.forEach(img => {
      const url = safeUrl(img.url);
      if (!url || existingUrls.has(url)) return;
      existingUrls.add(url);
      const fig = createImageFigure(img, state.imagesOffset + added);
      if (fig) { grid.append(fig); added++; }
    });
    state.imagesOffset += added;
    preloadImages(imgs.slice(added, added + 8).map(i => safeUrl(i.url)).filter(Boolean));
  } catch (e) {
    skeletons.forEach(sk => { if (sk.parentNode) sk.remove(); });
  } finally {
    state.imagesLoading = false;
  }
}

function setupInfiniteScroll() {
  let scrollTimeout;
  window.addEventListener('scroll', () => {
    if (state.tab !== 'images' || state.imagesLoading) return;
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => {
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 500) {
        loadMoreImages();
      }
    }, 100);
  });
}

// Проверяем доступность бэкенда
async function checkBackend() {
  try {
    const res = await fetch(CONFIG.API_BASE + '/health', { signal: AbortSignal.timeout(3000) });
    state.backendAvailable = res.ok;
    if (res.ok) console.log('✅ Backend доступен');
  } catch {
    state.backendAvailable = false;
    console.log('⚠️ Backend недоступен, работаем напрямую');
  }
}

function init() {
  fillIcons();
  setupSearchBox($('#hdrBox'));
  setupSearchBox($('#homeBox'));
  fillIcons();
  initSettings();
  setTheme(state.theme);
  setupInfiniteScroll();

  $$('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  $$('[data-theme-set]').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.themeSet)));
  $('#themeBtn').addEventListener('click', () => setTheme(state.theme === 'dark' ? 'light' : 'dark'));

  $('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b && state.q) navigate(state.q, b.dataset.tab); });
  $('#brandLink').addEventListener('click', e => { e.preventDefault(); navigate('', 'all'); });

  $('#settingsBtn').addEventListener('click', () => openModal('settingsModal'));
  $('#loginBtn').addEventListener('click', () => { setAuthMode('login'); openModal('authModal'); });
  $$('.overlay').forEach(o => o.addEventListener('mousedown', e => { if (e.target === o) closeModal(); }));
  $$('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  $('#userBtn').addEventListener('click', e => { e.stopPropagation(); $('#userMenu').hidden = !$('#userMenu').hidden; });
  $('#umSettings').addEventListener('click', () => openModal('settingsModal'));
  $('#umLogout').addEventListener('click', async () => { 
    closeMenus(); 
    setSession(null); 
    if (firebaseAuth) {
      try { await firebaseAuth.signOut(); } catch {}
    }
    toast(t('bye')); 
  });
  document.addEventListener('click', e => { if (!e.target.closest('#userWrap')) closeMenus(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeMenus(); }
    else if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !$('.overlay.open')) {
      e.preventDefault(); (isHome() ? $('#homeBox input') : $('#hdrBox input')).focus();
    }
  });

  $('#authTabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setAuthMode(b.dataset.auth); });
  $('#authForm').addEventListener('submit', submitAuth);
  $('#googleBtn').addEventListener('click', googleLogin);

  window.addEventListener('hashchange', applyRoute);
  applyI18n();
  
  // Сначала проверяем бэкенд, потом загружаем данные
  checkBackend().then(() => {
    applyRoute();
  });
}
init();
})();
</script>
